# 数据库是 SQLite，落在 /data 上的一个文件；上传的附件也在 /data/files。
#
# ⚠️ 因此 accessMode 只能是 RWO，副本数只能是 1 —— 两个 pod 同时写一个
# SQLite 文件会损坏它。要多副本必须先换掉存储层，那是另一件事。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calton-data
  namespace: calton
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
