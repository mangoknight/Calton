# ⚠️ 不要提交真实值。用下面这行现场生成后再 apply：
#
#   kubectl -n calton create secret generic calton-secrets \
#     --from-literal=CALTON_SERVICE_SECRET="$(openssl rand -hex 32)"
#
# 本文件只是形状说明。CALTON_SERVICE_SECRET 是 JWT 签名密钥 —— 它一变，
# 所有已签发的 token 立刻失效；它固定成一个可猜的值，任何人都能自签 token。
apiVersion: v1
kind: Secret
metadata:
  name: calton-secrets
  namespace: calton
type: Opaque
stringData:
  CALTON_SERVICE_SECRET: "REPLACE_ME"
